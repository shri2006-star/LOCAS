version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: locas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: locas
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: .
    container_name: locas-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_NAME: locas
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_URL: jdbc:mysql://mysqldb:3306/locas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_DIALECT: org.hibernate.dialect.MySQLDialect
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data:
